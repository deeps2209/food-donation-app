<!DOCTYPE html>
<html>
<head>

    <title>Available Donations</title>

    <style>

        body{
            font-family: Arial;
            background: #f5f7ff;
            margin:0;
            padding:0;
        }

        h1{
            text-align:center;
            margin-top:40px;
            color:#222;
        }

        .container{
            width:80%;
            margin:auto;
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        .card{
            background:white;
            width:70%;
            margin:20px;
            padding:25px;
            border-radius:15px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
        }

        .card h2{
            margin-bottom:15px;
            color:#333;
        }

        .card p{
            font-size:20px;
            color:#555;
        }

        .btns{
            margin-top:20px;
        }

        .accept-btn{
            background:green;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:8px;
            cursor:pointer;
            margin-right:10px;
        }

        .reject-btn{
            background:red;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:8px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <h1>Available Donations</h1>

    <div class="container">

        {% for food in donations %}

        <div class="card">

            <h2>{{ food.food }}</h2>

            <p><b>Donor:</b> {{ food.donor }}</p>

            <p><b>Location:</b> {{ food.location }}</p>

            <div class="btns">

                <a href="/accept/{{ loop.index }}">
                    <button class="accept-btn">Accept</button>
                </a>

                <a href="/reject/{{ loop.index }}">
                    <button class="reject-btn">Reject</button>
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</body>
</html>
