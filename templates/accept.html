<!DOCTYPE html>
<html>
<head>

    <title>NGO Accepted</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f6f9;
            display:flex;

            height:100vh;
        }

        .card{
            background:white;
            padding:40px;
            width:450px;
            border-radius:15px;

        h1{
            color:green;
        }

        .info{

            font-size:20px;
        }

</head>

<body>

<div class="card">

    <h1>✅ NGO Selected Successfully</h1>

    <div class="info">

        <p><b>NGO Name:</b> {{ ngo_name }}</p>

        <p><b>Location:</b> {{ ngo_location }}</p>

    </div>

</div>

</body>
</html>
