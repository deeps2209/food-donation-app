<!DOCTYPE html>
<html>
<head>

    <title>Volunteer Dashboard</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f7ff;
            margin:0;
            padding:0;
        }

        h1{
            text-align:center;
            margin-top:40px;
            color:#222;
        }

        .container{
            width:80%;
            margin:auto;
        }

        .card{
            background:white;
            padding:25px;
            margin:20px 0;
            border-radius:15px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
        }

        .card h2{
            color:#333;
        }

        .card p{
            font-size:18px;
            color:#555;
        }

        .btn{
            background:green;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <h1>Volunteer Dashboard</h1>

    <div class="container">

        {% for food in foods %}

        <div class="card">

            <h2>{{ food.food_name }}</h2>

            <p><b>Quantity:</b> {{ food.quantity }}</p>

            <p><b>Location:</b> {{ food.location }}</p>

            <p><b>Donor:</b> {{ food.donor }}</p>

            <a href="/track_delivery">
                <button class="btn">
                    Start Delivery
                </button>
            </a>

        </div>

        {% endfor %}

    </div>

</body>
</html>
