<!DOCTYPE html>
<html>

<head>

    <title>AI NGO Matching</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
            padding:40px;
        }

        h1{
            text-align:center;
            color:#2e7d32;
            margin-bottom:40px;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:15px;
            margin-bottom:20px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        .ngo-name{
            font-size:28px;
            font-weight:bold;
        }

        .location{
            font-size:20px;
            margin-top:10px;
        }

        button{
            margin-top:20px;
            background:#4CAF50;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <h1>AI NGO Matching</h1>
{% for ngo in ngos %}

<div class="card">

    <div class="ngo-name">
        {{ ngo.name }}
    </div>

    <div class="location">
        Location: {{ ngo.location }}
    </div>

    <a href="/accept?name={{ ngo.name }}&location={{ ngo.location }}" class="btn">

        Select NGO

    </a>

</div>

{% endfor %}

</body>

</html>
